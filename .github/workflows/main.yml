name: Build installers

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
            extra: "--linux-shortcut --linux-deb-maintainer you@example.com"
          - os: ubuntu-latest
            type: rpm
            extra: "--linux-shortcut"
          - os: windows-latest
            type: msi
            extra: "--win-console --win-menu --win-shortcut --win-upgrade-uuid 3f6b2c1e-8a47-4d59-9b0e-5c2a7d1e4f90"
          - os: macos-latest
            type: dmg
            extra: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install rpm tools
        if: matrix.type == 'rpm'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Download JAR from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir input dist
          gh release download "$TAG" --pattern '*.jar' --dir input
          # keep only the fat jar, name it app.jar
          ls input
          mv input/video-stream-simulator-*[0-9].jar input/app.jar 2>/dev/null || mv input/*.jar input/app.jar
          cp src/main/resources/application.yml input/application.yml

      - name: Build installer
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"; VERSION="${VERSION%%-*}"   # 1.2.3 only (no -SNAPSHOT)
          jpackage \
            --type ${{ matrix.type }} \
            --name video-stream-simulator \
            --app-version "$VERSION" \
            --vendor "Your Company" \
            --input input \
            --main-jar app.jar \
            --dest dist \
            --add-modules java.se,jdk.unsupported,jdk.crypto.ec \
            --java-options '-Dspring.config.additional-location=file:$APPDIR/application.yml' \
            ${{ matrix.extra }}

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
